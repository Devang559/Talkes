name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      # -----------------------------
      # Java
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # -----------------------------
      # Android Environment
      # -----------------------------
      - name: Configure Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # -----------------------------
      # Gradle
      # -----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle Tasks
        working-directory: android
        run: ./gradlew tasks --no-daemon

      # -----------------------------
      # Build APK
      # -----------------------------
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # -----------------------------
      # Compress APK
      # -----------------------------
      - name: Compress APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

          gzip -c "$APK_PATH" > "${APK_PATH}.gz"

          echo "Uncompressed APK size:"
          ls -lh "$APK_PATH"

          echo "Compressed APK size:"
          ls -lh "${APK_PATH}.gz"

      # -----------------------------
      # Build AAB
      # -----------------------------
      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-apk-compressed
          path: ${{ env.APK_PATH }}.gz
          if-no-files-found: error

      # -----------------------------
      # Upload AAB
      # -----------------------------
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error