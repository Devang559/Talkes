name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

  android-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "ndk;26.1.10909125"
        shell: bash

      - name: Configure Gradle
        run: |
          touch $ANDROID_HOME/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> $ANDROID_HOME/gradle.properties
          echo "org.gradle.daemon=true" >> $ANDROID_HOME/gradle.properties
        shell: bash

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Compress APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          # Compress with gzip (reduces ~40% size)
          gzip -c "$APK_PATH" > "${APK_PATH}.gz"
          echo "Uncompressed APK size:"
          ls -lh "$APK_PATH"
          echo "Compressed APK size:"
          ls -lh "${APK_PATH}.gz"

      - name: Build Android App Bundle
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Upload APK (Compressed)
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-apk-compressed
          path: ${{ env.APK_PATH }}.gz
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  gradle-compatibility-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"
        shell: bash

      - name: Configure Gradle
        run: |
          touch $ANDROID_HOME/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> $ANDROID_HOME/gradle.properties
          echo "org.gradle.daemon=true" >> $ANDROID_HOME/gradle.properties
        shell: bash

      - name: Check Gradle Tasks
        working-directory: android
        run: ./gradlew tasks --no-daemon
