name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci-and-build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      # -----------------------------
      # Install Dependencies
      # -----------------------------
      - name: Install Dependencies
        run: npm ci

      # -----------------------------
      # Lint
      # -----------------------------
      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx

      # -----------------------------
      # TypeScript
      # -----------------------------
      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      # -----------------------------
      # Tests
      # -----------------------------
      - name: Run Tests
        run: npm test

      # -----------------------------
      # Java 17
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      # -----------------------------
      # Install Android SDK packages
      # -----------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # -----------------------------
      # Install Android NDK
      # -----------------------------
      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # -----------------------------
      # Accept Android Licenses
      # -----------------------------
      - name: Accept Android Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # -----------------------------
      # Android environment
      # -----------------------------
      - name: Configure Android Environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # -----------------------------
      # Check Gradle
      # -----------------------------
      - name: Check Gradle Tasks
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew tasks --no-daemon

      # -----------------------------
      # Build Release APK
      # -----------------------------
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # -----------------------------
      # Locate APK
      # -----------------------------
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*unaligned*" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"
            echo "Available build outputs:"
            find android/app/build/outputs -type f
            exit 1
          fi

          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Compress APK
      # -----------------------------
      - name: Compress APK
        run: |
          APK_PATH="${{ steps.apk.outputs.apk_path }}"

          gzip -c "$APK_PATH" > "${APK_PATH}.gz"

          echo "Uncompressed APK size:"
          ls -lh "$APK_PATH"

          echo "Compressed APK size:"
          ls -lh "${APK_PATH}.gz"

      # -----------------------------
      # Build Android App Bundle
      # -----------------------------
      - name: Build Android App Bundle
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      # -----------------------------
      # Upload Compressed APK
      # -----------------------------
      - name: Upload Compressed APK
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-apk-compressed
          path: ${{ steps.apk.outputs.apk_path }}.gz
          if-no-files-found: error

      # -----------------------------
      # Upload AAB
      # -----------------------------
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error