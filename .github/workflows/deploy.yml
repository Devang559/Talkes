name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      # Install JavaScript dependencies
      - name: Install Dependencies
        run: npm ci

      # ESLint
      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx

      # TypeScript
      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      # Tests
      - name: Run Tests
        run: npm test

      # Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Install exact Android versions required by Talkes
      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;27.1.12297006"

      # Accept licenses
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # Configure Android environment
      - name: Configure Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # IMPORTANT:
      # Git may not preserve the executable permission on gradlew.
      - name: Grant Gradle Execute Permission
        run: |
          chmod +x android/gradlew

      # Check Gradle
      - name: Check Gradle Tasks
        working-directory: android
        run: ./gradlew tasks --no-daemon

      # Build Release APK
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # Find APK
      - name: Find APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Found APK: $APK_PATH"

      # Compress APK
      - name: Compress APK
        run: |
          gzip -c "$APK_PATH" > "${APK_PATH}.gz"

          echo "Uncompressed APK size:"
          ls -lh "$APK_PATH"

          echo "Compressed APK size:"
          ls -lh "${APK_PATH}.gz"

      # Build Android App Bundle
      - name: Build Android App Bundle
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # Upload compressed APK
      - name: Upload APK (Compressed)
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-apk-compressed
          path: ${{ env.APK_PATH }}.gz
          if-no-files-found: error

      # Upload AAB
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error