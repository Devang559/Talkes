name: Talkes CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      # -------------------------
      # Install JS dependencies
      # -------------------------
      - name: Install Dependencies
        run: npm ci

      # -------------------------
      # Lint
      # -------------------------
      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx

      # -------------------------
      # TypeScript
      # -------------------------
      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      # -------------------------
      # Tests
      # -------------------------
      - name: Run Tests
        run: npm test -- --watch=false

      # -------------------------
      # Java
      # -------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # -------------------------
      # Android SDK
      # -------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # -------------------------
      # Android SDK Components
      # -------------------------
      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;27.1.12297006"

      # -------------------------
      # Accept licenses
      # -------------------------
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # -------------------------
      # Android environment
      # -------------------------
      - name: Configure Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # -------------------------
      # Gradle permission
      # -------------------------
      - name: Grant Gradle Execute Permission
        run: |
          chmod +x android/gradlew

      # -------------------------
      # Gradle tasks check
      # -------------------------
      - name: Check Gradle Tasks
        working-directory: android
        run: |
          ./gradlew clean --no-daemon
          ./gradlew tasks --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false

      # -------------------------
      # Build Release APK
      # -------------------------
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # -------------------------
      # Prepare APK
      # -------------------------
      - name: Prepare APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi

          mkdir -p release

          cp "$APK_PATH" release/Talkes.apk

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "APK:"
          ls -lh release/Talkes.apk

      # -------------------------
      # Compress APK
      # -------------------------
      - name: Compress APK
        run: |
          gzip -c release/Talkes.apk > release/Talkes.apk.gz

          echo "Compressed APK:"
          ls -lh release/Talkes.apk.gz

      # -------------------------
      # Build AAB
      # -------------------------
      - name: Build Android App Bundle
        working-directory: android
        run: |
          ./gradlew clean bundleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --stacktrace

      # -------------------------
      # Prepare AAB
      # -------------------------
      - name: Prepare AAB
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "$AAB_PATH" ]; then
            echo "AAB not found!"
            exit 1
          fi

          cp "$AAB_PATH" release/Talkes.aab

          echo "AAB:"
          ls -lh release/Talkes.aab

      # -------------------------
      # Upload APK Artifact
      # -------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-apk
          path: release/Talkes.apk
          if-no-files-found: error

      # -------------------------
      # Upload Compressed APK
      # -------------------------
      - name: Upload APK (Compressed)
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-apk-compressed
          path: release/Talkes.apk.gz
          if-no-files-found: error

      # -------------------------
      # Upload AAB Artifact
      # -------------------------
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkes-release-aab
          path: release/Talkes.aab
          if-no-files-found: error

      # -------------------------
      # Create GitHub Release
      # -------------------------
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talkes v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/Talkes.apk
            release/Talkes.aab
            release/Talkes.apk.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}