
name: Talkes CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:

  # ==============================
  # CI - Lint, TypeScript & Tests
  # ==============================
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test


  # ==============================
  # Android Build
  # ==============================
  android-build:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: npm ci

      # Do not install the deprecated "tools" package
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;27.1.12297006"

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare Release Files
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/release/*.apk \
            release/Talkes-release.apk

          cp android/app/build/outputs/bundle/release/*.aab \
            release/Talkes-release.aab

          zip -j release/Talkes-release.zip \
            release/Talkes-release.apk

      # ==============================
      # Upload GitHub Actions Artifacts
      # ==============================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talkes-APK
          path: release/Talkes-release.apk

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Talkes-Release-ZIP
          path: release/Talkes-release.zip

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Talkes-AAB
          path: release/Talkes-release.aab

      # ==============================
      # GitHub Release
      # Only runs on main
      # ==============================

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talkes v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/Talkes-release.apk
            release/Talkes-release.zip

