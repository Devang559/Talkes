name: Build Talkes Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Android SDK setup
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: 27.1.12297006
          build-tools-version: 35.0.0

      # Install exact Android versions required by Talkes
      - name: Install Android SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"

      # Accept Android licenses
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Environment variables
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV

      # Install JavaScript dependencies
      - name: Install dependencies
        run: npm ci

      # Make Gradle executable
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      # Check Gradle configuration
      - name: Check Gradle
        working-directory: android
        run: ./gradlew --version

      # Build Release APK
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # Find APK
      - name: Locate APK
        run: |
          find android/app/build/outputs/apk -type f -name "*.apk"

      # Rename APK
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Talkes.apk

      # Build Release AAB
      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            --warning-mode all \
            --stacktrace

      # Find AAB
      - name: Locate AAB
        run: |
          find android/app/build/outputs/bundle -type f -name "*.aab"

      # Copy AAB
      - name: Prepare AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab release/Talkes.aab

      # Upload build artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talkes-APK
          path: release/Talkes.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Talkes-AAB
          path: release/Talkes.aab

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Talkes v1.0.${{ github.run_number }}
          files: |
            release/Talkes.apk
            release/Talkes.aab
          generate_release_notes: true